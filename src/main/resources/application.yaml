app:
  hashids:
    salt: ${HASHIDS_SALT:dev-salt-local}
    min-length: 6

spring:
  datasource:
    url: ${POSTGRES_DB_URL}
    username: ${POSTGRES_DB_USER}
    password: ${POSTGRES_DB_PASSWORD}

  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  config:
    import: optional:file:.env[.properties]

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    com.luismiguel: INFO