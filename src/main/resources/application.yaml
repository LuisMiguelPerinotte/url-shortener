server:
  port: ${PORT:8080}

app:
  hashids:
    salt: ${HASHIDS_SALT:dev-salt-local}
    min-length: 6
  rate-limit:
    write-per-minute: 10
    read-per-minute: 120
    # trailing X-Forwarded-For entries added by trusted proxies; 0 = use getRemoteAddr(). On Render use 1 (APP_RATE_LIMIT_PROXY_HOPS)
    proxy-hops: 0

spring:
  datasource:
    url: ${POSTGRES_DB_URL}
    username: ${POSTGRES_DB_USER}
    password: ${POSTGRES_DB_PASSWORD}

  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  config:
    import: optional:file:.env[.properties]

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    com.luismiguel: INFO