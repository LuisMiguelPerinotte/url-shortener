services:
  postgres:
    image: postgres:16-alpine
    container_name: url-shortener-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_DB_USER}
      POSTGRES_PASSWORD: ${POSTGRES_DB_PASSWORD}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_DB_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    profiles: ["app"]
    build: .
    container_name: url-shortener-app
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      # Inside the Compose network the database host is the service name, not localhost.
      POSTGRES_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres_data: